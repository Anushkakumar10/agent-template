services:
  db:
    image: postgres:16-alpine
    container_name: agent-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_dashboard_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dashboard_data:
